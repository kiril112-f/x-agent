<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cover</title>
<style>
@font-face{
  font-family:'Inter Variable';
  src:local('Inter Variable'),local('Inter'),url('file:///C:/Windows/Fonts/Inter-VariableFont_opsz,wght.ttf');
  font-weight:100 900;
}
html,body{margin:0;padding:0;background:#000;overflow:hidden;}
#cover{position:relative;width:var(--w,1536px);height:var(--h,512px);overflow:hidden;background:#05060a;}
.field{position:absolute;inset:0;}
.vignette{position:absolute;inset:0;pointer-events:none;}
.glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:124%;height:205%;border-radius:50%;}
.grain{position:absolute;inset:0;opacity:.028;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;}
.text{display:flex;flex-direction:column;justify-content:center;}
.kicker{color:#fff;opacity:.62;text-transform:uppercase;font-weight:600;}
.hero{color:#fff;}
.hero .line{white-space:nowrap;}
.hero.occ{position:absolute;inset:0;}
.hero.occ .line{position:absolute;left:50%;transform:translateX(-50%);line-height:1;}
.obj{position:absolute;}
.obj img{display:block;width:100%;height:auto;}
.plates{position:absolute;display:flex;align-items:center;}
.plate{position:relative;overflow:hidden;background:#0b0d16;
  border-radius:var(--plate-r,32px);
  border:var(--plate-b,2px) solid rgba(255,255,255,.74);
  box-shadow:0 var(--plate-sy,10px) var(--plate-sb,60px) rgba(3,4,10,.6);}
.plate img{display:block;width:100%;height:100%;object-fit:cover;}
.plate.bare{background:none;border:0;box-shadow:none;border-radius:0;overflow:visible;}
.plate.bare img{width:auto;height:100%;object-fit:contain;}
.arw{flex:0 0 auto;}
.mark{position:absolute;color:rgba(255,255,255,.55);font-weight:500;}
</style>
</head>
<body>
<div id="cover">
  <div class="field"></div>
  <div class="glow"></div>
  <div class="vignette"></div>
  <div class="stage">
    <div class="text"><div class="kicker"></div><div class="hero"></div></div>
    <div class="obj"></div>
  </div>
  <div class="grain"></div>
  <div class="mark"></div>
</div>
<script>
var q = new URLSearchParams(location.search);
function str(k,d){var v=q.get(k);return (v===null||v==='')?d:v;}
function num(k,d){var v=q.get(k);if(v===null||v==='')return d;var n=parseFloat(v);return isNaN(n)?d:n;}

var W = num('w',1536), H = num('h',512), K = W/1500;
var layout = str('layout','l5');
var occ = (layout === 'l5');
var FAM = "'Inter Variable', Inter, 'Helvetica Now Display', 'Arial Black', Montserrat, sans-serif";
var TRACK = '-0.045em';
var ACCENT = '#FF8A1F';
var FIELDS = {
  cobalt:['#4B6BFF','#1B3BEF','#080D4A'],
  violet:['#8B4BFF','#6B2BF0','#1A0546'],
  teal:['#12B8A2','#0B8E7E','#01302A'],
  graphite:['#2A2C3A','#16171F','#050508']
};

var root = document.documentElement.style;
root.setProperty('--w', W+'px');
root.setProperty('--h', H+'px');
root.setProperty('--plate-r', (0.022*W)+'px');
root.setProperty('--plate-b', Math.max(1, 0.0013*W)+'px');
root.setProperty('--plate-sy', (0.02*H)+'px');
root.setProperty('--plate-sb', (0.12*H)+'px');

var cover = document.getElementById('cover');
var fieldEl = cover.querySelector('.field');
var glowEl = cover.querySelector('.glow');
var vigEl = cover.querySelector('.vignette');
var stage = cover.querySelector('.stage');
var kickEl = cover.querySelector('.kicker');
var heroEl = cover.querySelector('.hero');
var objEl = cover.querySelector('.obj');
var markEl = cover.querySelector('.mark');

var accentOn = str('accent','off') !== 'off';
var fname = str('field','cobalt');
var pal = str('fieldc','') ? str('fieldc','').split(',') : (FIELDS[fname] || FIELDS.cobalt);
var glowX = num('glowx',50);
var glowP = num('fieldg',12)/100;
var edgeP = num('fielde',0)/100;
fieldEl.style.background = 'radial-gradient(130% 155% at '+glowX+'% 10%, '+pal[0]+' 0%, '+(pal[1]||pal[0])+' 45%, '+(pal[2]||pal[1]||pal[0])+' 100%)';
glowEl.style.background = 'radial-gradient(closest-side, rgba(255,255,255,'+glowP+') 0%, rgba(255,255,255,0) 72%)';
if(edgeP > 0){ vigEl.style.background = 'radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,'+edgeP+') 100%)'; }

var heroRaw = str('hero','organic|installs');
var lines = heroRaw.split('|').map(function(s){return s.trim();}).filter(function(s){return !!s;}).slice(0,4);
heroEl.innerHTML = '';
var lineEls = lines.map(function(t){
  var d = document.createElement('div'); d.className='line'; d.textContent = t; heroEl.appendChild(d); return d;
});
heroEl.style.fontFamily = FAM;
heroEl.style.fontWeight = 900;
heroEl.style.letterSpacing = TRACK;
heroEl.style.lineHeight = occ ? '1' : '.92';

var kickerTxt = str('kicker','');
kickEl.textContent = kickerTxt;
kickEl.style.fontFamily = FAM;
kickEl.style.letterSpacing = '0.10em';
kickEl.style.fontSize = (46*K)+'px';
kickEl.style.marginBottom = (26*K)+'px';
if(accentOn){ kickEl.style.color = ACCENT; kickEl.style.opacity = 1; }
if(!kickerTxt){ kickEl.style.display = 'none'; }

var handle = str('mark', occ ? 'off' : '@KirillMorozovop');
markEl.textContent = (handle === 'off') ? '' : handle;
markEl.style.fontFamily = FAM;
markEl.style.fontSize = (22*K)+'px';
markEl.style.letterSpacing = '0.06em';

var padX = num('padx', occ ? 54 : 90)*K;
var padY = num('pady', occ ? 30 : 60)*K;
var coverF = num('cover',16)/100;
var bandMinPx = num('bandmin',13)/100*H;
var bandMaxPx = num('bandmax',46)/100*H;
var gapPx = num('gap',3.2)/100*W;
var tilt = num('tilt',0);
var bleed = num('bleed',0)/100;
var fill = num('fill',96)/100;
var clusterMax = num('clustermax',68)/100;
var plateStyle = str('platestyle','card');
var plateUrls = str('plate','').split(',').map(function(s){return s.trim();}).filter(function(s){return !!s;});
var arrowMode = str('arrow','auto');

var dims = {};
var warn = [];
function hygiene(ok, msg){ if(!ok) warn.push(msg); }

var ctx = document.createElement('canvas').getContext('2d');
function ink(text, px){
  ctx.font = '900 '+px+'px '+FAM;
  try { ctx.letterSpacing = TRACK; } catch(e) {}
  var m = ctx.measureText(text);
  return {
    asc: m.actualBoundingBoxAscent,
    desc: m.actualBoundingBoxDescent,
    fbAsc: m.fontBoundingBoxAscent,
    fbDesc: m.fontBoundingBoxDescent
  };
}
function probe(size){
  heroEl.style.fontSize = size+'px';
  return lineEls.map(function(el, i){
    var m = ink(lines[i], size);
    return {el:el, text:lines[i], w:el.scrollWidth, asc:m.asc, desc:m.desc, fbAsc:m.fbAsc, fbDesc:m.fbDesc};
  });
}
function widestOf(p){ return p.reduce(function(a,x){return Math.max(a, x.w);}, 0); }
function inkHeight(p){ return p.reduce(function(a,x){return a + x.asc + x.desc;}, 0); }

function aspect(u){ var d = dims[u]; return (d && d.h) ? (d.w/d.h) : 1; }

function layoutOcclusion(){
  var old = cover.querySelector('.plates');
  if(old) old.remove();

  var words = heroRaw.replace(/\|/g,' ').trim().split(/\s+/).length;
  hygiene(lines.length <= 2, 'строк '+lines.length+' — в l5 максимум 2');
  hygiene(words <= 6, 'слов '+words+' — максимум 6');
  hygiene(heroRaw.indexOf('@') === -1, 'в l5 нет инлайн-иконок: убери @ из hero');
  hygiene(!/[A-Z\u0410-\u042F]{3}/.test(heroRaw), 'hero набран капсом — в доме строчные');
  if(kickerTxt) warn.push('в l5 кикер не рисуется — всю работу делает hero');

  var maxLineW = W*fill + bleed*W;
  var minRest = (lines.length > 1) ? bandMinPx : bandMinPx*0.6;
  var size = 48*K, p = probe(size), best = {size:size, p:p};
  while(size < 900*K){
    var nextSize = size + 2*K;
    var np = probe(nextSize);
    if(widestOf(np) <= maxLineW && (H - 2*padY - inkHeight(np)) >= minRest){
      size = nextSize; best = {size:size, p:np};
    } else { break; }
  }
  size = best.size; p = probe(size);

  var inkH = inkHeight(p);
  var free = H - 2*padY - inkH;
  if(lines.length > 1){
    var y = padY;
    p.forEach(function(x, i){
      x.inkTop = y; x.inkBot = y + x.asc + x.desc;
      y = x.inkBot + free/(lines.length-1);
    });
  } else {
    p[0].inkTop = (H - inkH)/2; p[0].inkBot = p[0].inkTop + inkH;
  }
  p.forEach(function(x){
    var halfLead = (size - (x.fbAsc + x.fbDesc))/2;
    x.el.style.top = (x.inkTop + x.asc - halfLead - x.fbAsc)+'px';
  });

  var first = p[0], last = p[p.length-1];
  var capH = first.asc;
  var bandTop = first.inkBot - coverF*first.asc;
  var bandBot = (lines.length > 1) ? (last.inkTop + coverF*last.asc) : (bandTop + 0.62*capH);
  var bandMid = (bandTop + bandBot)/2;
  var plateH = Math.min(Math.max(bandBot - bandTop, 12), bandMaxPx);

  var widest = widestOf(p);
  var typeFill = (last.inkBot - first.inkTop)/H;

  if(plateUrls.length === 0){
    warn.push('нет плашек — текст не перекрыт, а без перекрытия обложка не в доме');
    return {size:Math.round(size/K), covered:0, plateH:0, cluster:0,
            lineW:Math.round(widest/W*100), typeFill:Math.round(typeFill*100)};
  }
  hygiene(plateUrls.length <= 3, 'плашек '+plateUrls.length+' — больше трёх каша');

  var arrow = (arrowMode === 'on') || (arrowMode === 'auto' && plateUrls.length === 2);
  var arrowW = arrow ? Math.round(44*K) : 0;
  var seam = arrow ? (gapPx*2 + arrowW) : gapPx;
  var fixedW = (plateUrls.length - 1)*seam;
  var clusterCap = Math.min(clusterMax*W, 0.72*p.reduce(function(a,x){return Math.min(a, x.w);}, 1e9));
  var perPlate = Math.max((clusterCap - fixedW)/plateUrls.length, 40);

  var bare = (plateStyle === 'bare');
  if(bare){
    var arSum = plateUrls.reduce(function(a,u){return a + aspect(u);}, 0);
    if(plateH*arSum + fixedW > clusterCap){
      plateH = Math.max((clusterCap - fixedW)/arSum, 12);
    }
  }

  var platesEl = document.createElement('div');
  platesEl.className = 'plates';
  platesEl.style.gap = gapPx+'px';
  var total = fixedW;
  plateUrls.forEach(function(u, i){
    if(i > 0 && arrow){
      var holder = document.createElement('div');
      holder.innerHTML = '<svg class="arw" width="'+arrowW+'" height="'+Math.round(24*K)+'" viewBox="0 0 44 24" fill="none">'+
        '<path d="M3 12h38m0 0l-9-8m9 8l-9 8" stroke="'+(accentOn ? ACCENT : '#fff')+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      platesEl.appendChild(holder.firstChild);
    }
    var box = document.createElement('div');
    box.className = 'plate' + (bare ? ' bare' : '');
    var wNat = plateH*aspect(u);
    var wUse = bare ? wNat : Math.min(wNat, perPlate);
    box.style.height = plateH+'px';
    box.style.width = wUse+'px';
    var img = document.createElement('img');
    img.src = u;
    box.appendChild(img);
    platesEl.appendChild(box);
    total += wUse;
  });
  platesEl.style.left = (W/2)+'px';
  platesEl.style.top = bandMid+'px';
  platesEl.style.transform = 'translate(-50%,-50%)' + (tilt ? (' rotate('+tilt+'deg)') : '');
  cover.appendChild(platesEl);

  glowEl.style.left = (W/2)+'px';
  glowEl.style.top = bandMid+'px';

  if(handle !== 'off'){
    markEl.style.right = padX+'px';
    markEl.style.left = 'auto';
    markEl.style.top = (bandMid - 11*K)+'px';
    var room = (W - total)/2 - padX - markEl.offsetWidth;
    hygiene(room >= 12*K, 'марка упирается в кластер — в l5 лучше -Mark off');
  }

  var covered = (first.inkBot - (bandMid - plateH/2))/first.asc*100;
  hygiene(covered >= 8 && covered <= 40, 'заход плашки '+Math.round(covered)+'% — нужно 8–40% высоты капители');
  hygiene(total <= clusterCap + 1, 'кластер шире допустимого — закроет крайние буквы');
  hygiene(size >= 150*K, 'кегль '+Math.round(size/K)+' px — нужно от 150 px канона');
  var fillMin = (lines.length > 1) ? 0.74 : 0.42;
  var widthMin = (lines.length > 1) ? 0.45 : 0.80;
  hygiene(typeFill >= fillMin, 'текст занимает '+Math.round(typeFill*100)+'% высоты — нужно от '+Math.round(fillMin*100)+'%');
  hygiene(widest >= widthMin*W, 'самая длинная строка '+Math.round(widest/W*100)+'% ширины — копию надо удлинить');

  return {size:Math.round(size/K), covered:Math.round(covered), plateH:Math.round(plateH/K),
          cluster:Math.round(total/W*100), lineW:Math.round(widest/W*100), typeFill:Math.round(typeFill*100)};
}

function layoutLegacy(){
  warn.push('l1–l4 — резервные лейауты; маршрут дома — l5 с перекрытием текста');
  stage.style.padding = padY+'px '+padX+'px';
  var objUrl = str('obj','');
  if(objUrl){
    var objW = num('objw', 34)/100*W;
    objEl.innerHTML = '<img src="'+objUrl+'">';
    objEl.style.width = objW+'px';
    objEl.style.right = (num('objx',-60)*K)+'px';
    objEl.style.top = (H/2 + num('objy',0)*K)+'px';
    objEl.style.transform = 'translateY(-50%)';
  } else { objEl.style.display = 'none'; }

  var cap = (layout === 'l4') ? 130*K : 250*K;
  var forced = num('hero_px',0)*K;
  var size = forced || cap;
  var maxW = (objUrl ? 0.62 : 0.94)*W - padX;
  while(size > 60*K){
    var p = probe(size);
    if(widestOf(p) <= maxW && inkHeight(p) <= (H - 2*padY - (kickerTxt ? 70*K : 0))) break;
    if(forced) break;
    size -= 2*K;
  }
  var p2 = probe(size);
  hygiene(size >= 110*K, 'кегль '+Math.round(size/K)+' px — мелко для обложки');
  if(handle !== 'off'){
    markEl.style.right = padX+'px';
    markEl.style.bottom = (padY*0.6)+'px';
  }
  return {size:Math.round(size/K), covered:0, plateH:0, cluster:0,
          lineW:Math.round(widestOf(p2)/W*100), typeFill:Math.round(inkHeight(p2)/H*100)};
}

function preload(){
  var urls = plateUrls.slice();
  var o = str('obj',''); if(o) urls.push(o);
  return Promise.all(urls.map(function(u){
    return new Promise(function(res){
      var im = new Image();
      im.onload = function(){ dims[u] = {w:im.naturalWidth, h:im.naturalHeight}; res(); };
      im.onerror = function(){ dims[u] = null; warn.push('не загрузился ассет: '+u); res(); };
      im.src = u;
    });
  }));
}

function boot(){
  if(occ){
    heroEl.classList.add('occ');
    cover.appendChild(heroEl);
    stage.style.display = 'none';
  }
  var report;
  if(occ){
    layoutOcclusion();
    warn.length = 0;
    report = layoutOcclusion();
  } else {
    report = layoutLegacy();
  }
  var uniq = warn.filter(function(v,i,a){return a.indexOf(v) === i;});
  var out = Object.assign({}, report, {warn:uniq});
  console.log('ГЕОМЕТРИЯ '+JSON.stringify(out));
  console.log('ПРИЁМКА: '+(uniq.length ? uniq.join(' | ') : 'ок, можно показывать'));
  document.title = uniq.length ? 'ready-with-warnings' : 'ready';
}

document.fonts.ready.then(preload).then(boot);
</script>
</body>
</html>
