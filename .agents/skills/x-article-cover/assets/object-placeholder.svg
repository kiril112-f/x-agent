<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Плейсхолдер объекта: стеклянная карта. Нужен только чтобы проверять композицию
       до того, как приедет настоящий 3D-рендер. В продакшене заменяется на PNG с альфой. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#bcd2ff" stop-opacity=".28"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#FF8A1F" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#FF8A1F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <g transform="translate(300 300) rotate(-8) translate(-300 -300)">
    <ellipse cx="300" cy="452" rx="185" ry="26" fill="#000" opacity=".28" filter="url(#soft)"/>
    <rect x="110" y="150" width="380" height="250" rx="30" fill="url(#glass)"/>
    <rect x="110" y="150" width="380" height="250" rx="30" fill="none"
          stroke="#ffffff" stroke-opacity=".75" stroke-width="3"/>
    <rect x="110" y="150" width="380" height="250" rx="30" fill="none"
          stroke="url(#rim)" stroke-width="7"/>
    <rect x="150" y="205" width="72" height="54" rx="10" fill="#ffffff" opacity=".5"/>
    <path d="M110 180 Q 200 150 320 150 L 300 400 Q 160 400 110 330 Z"
          fill="url(#gloss)" opacity=".5"/>
  </g>
</svg>
